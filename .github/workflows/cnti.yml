# Fork test of lfn-cnti/testsuite-action main (3c0e163, #37) before v1.4.0:
# free5GC's essential job from #44 on a GitHub-hosted runner, with gh removed
# as on free5GC's self-hosted runner. A push before this branch is the
# default publishes nothing; a manual and a scheduled run with it as the
# default publish the badge, the evidence artifact and the attestation.
name: CNTi essential (fork test)

on:
  workflow_dispatch:
  schedule:
    - cron: "50 19 * * *"
  push:
    branches: [cnti-forktest]

permissions:
  contents: read

concurrency:
  group: cnti-forktest
  cancel-in-progress: false

jobs:
  essential:
    # gtp5g v0.10.2 builds on 22.04's kernel; ubuntu-latest's 7.0 breaks it.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      CNTI_TESTSUITE_GENERIC_OPERATION_TIMEOUT: "180"
    outputs:
      exit_code: ${{ steps.cnti.outputs.exit_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and load the gtp5g kernel module
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential "linux-headers-$(uname -r)"
          git clone --depth 1 --branch v0.10.2 https://github.com/free5gc/gtp5g.git /tmp/gtp5g
          make -C /tmp/gtp5g -j"$(nproc)"
          sudo make -C /tmp/gtp5g install
          sudo modprobe gtp5g
          test -d /sys/module/gtp5g && echo "gtp5g loaded on kernel $(uname -r)"

      # As on free5GC's self-hosted runner: no gh.
      - name: Remove gh
        run: |
          set -euo pipefail
          while p=$(command -v gh); do sudo rm -f "$p"; hash -r; done
          if command -v gh; then exit 1; fi
          echo "gh removed"

      - uses: lfn-cnti/testsuite-action@3c0e163cbbdde302cdd9abb9dbe8c2cbd6a72c71 # main, #37
        id: cnti
        with:
          version: v2.4.1
          cnf_config: cnti-testsuite.yaml
          kind_config: ci/kind-cnti.yaml
          install_timeout: 1800
          tests: cert
          badge_branch: badges
          attest: "true"

  # With gh again: what the run published, and what it should not have.
  check:
    needs: essential
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check what was published
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -uo pipefail
          default=$(gh api "repos/$REPO" --jq .default_branch)
          on_default=false; [[ "$REF" == "refs/heads/$default" && "$EVENT" != pull_request* ]] && on_default=true
          echo "event=$EVENT ref=$REF default=$default -> expect published: $on_default"
          # The run is still going (this job): the finished essential job's own log.
          job=$(gh api "repos/$REPO/actions/runs/$RUN/jobs" --jq '.jobs[]|select(.name=="essential")|.id')
          log=$(curl -sSfL -H "Authorization: Bearer $GH_TOKEN" "${GITHUB_API_URL}/repos/$REPO/actions/jobs/$job/logs")
          [[ -n "$log" ]] || { echo "::error::no log for the essential job"; exit 1; }
          grep -a -E 'Default branch: |default branch is unknown|Badge (not )?published|Attested|Evidence not signed|essential tests passed' <<< "$log" | sed 's/^[^\t]*\t[^\t]*\t//' | sort -u
          arts=$(gh api "repos/$REPO/actions/runs/$RUN/artifacts" --jq '[.artifacts[].name]|join(",")'); echo "artifacts: $arts"
          badge_sha=$(gh api "repos/$REPO/commits/badges" --jq '.sha + " " + .commit.committer.date' 2>/dev/null || echo none); echo "badges branch: $badge_sha"
          ok=true
          grep -q 'gh: command not found' <<< "$log" && { echo "::error::something still called gh"; ok=false; }
          if [[ "$on_default" == true ]]; then
            grep -q "on the default branch: true" <<< "$log" || { echo "::error::the branch step did not see the default branch"; ok=false; }
            grep -qE 'Published badge|Badge published' <<< "$log" || { echo "::error::no badge published"; ok=false; }
            grep -q 'Attested ' <<< "$log" || { echo "::error::not attested"; ok=false; }
            [[ ",$arts," == *",cnti-evidence,"* ]] || { echo "::error::no cnti-evidence artifact"; ok=false; }
          else
            grep -q "on the default branch: false" <<< "$log" || { echo "::error::the branch step should say false"; ok=false; }
            grep -q 'Badge not published: .* is not the default branch' <<< "$log" || { echo "::error::expected the badge to be withheld"; ok=false; }
            grep -q 'Attested ' <<< "$log" && { echo "::error::attested off the default branch"; ok=false; }
          fi
          $ok
