# Fork experiment: free5GC with MongoDB's tini and the UPFs not running as
# root. The UPF image with file capabilities is built here and loaded into
# kind, nothing is published. Two jobs: the essential tests, and a UE's
# traffic through the non-root UPFs.
name: free5GC non-root (fork experiment)
on:
  push:
    branches: [cnti-nonroot-experiment]
  workflow_dispatch:
jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        job: [traffic-baseline, traffic-nonroot]
    name: ${{ matrix.job }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CNTI_TESTSUITE_GENERIC_OPERATION_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build and load the gtp5g kernel module
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential "linux-headers-$(uname -r)"
          git clone --depth 1 --branch v0.10.2 https://github.com/free5gc/gtp5g.git /tmp/gtp5g
          make -C /tmp/gtp5g -j"$(nproc)"
          sudo make -C /tmp/gtp5g install
          sudo modprobe gtp5g
      - name: Build the UPF image with file capabilities
        run: docker build -t free5gc/upf:v4.3.0-caps -f ci/nonroot/Dockerfile.upf ci/nonroot
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: cnti-testsuite
          config: ci/kind-cnti.yaml
      - name: Load the image into kind
        run: kind load docker-image free5gc/upf:v4.3.0-caps --name cnti-testsuite

      # Baseline: the charts of the commit before the experiment (root UPFs,
      # install-tini as root), no image override.
      - name: Baseline charts
        if: matrix.job == 'traffic-baseline'
        run: |
          set -euo pipefail
          git checkout 92dc5bc -- charts/free5gc cnti-testsuite.yaml
          if grep -q runAsNonRoot charts/free5gc/charts/free5gc-upf/values.yaml; then echo '::error::baseline still has the non-root values'; exit 1; fi
          grep -n 'image: debian:12-slim' charts/free5gc/charts/mongodb-15.6.0/values.yaml

      - uses: lfn-cnti/testsuite-action@3c0e163cbbdde302cdd9abb9dbe8c2cbd6a72c71 # v1.4.0
        if: matrix.job == 'essential'
        with:
          version: v2.4.1
          cnf_config: cnti-testsuite.yaml
          create_kind_cluster: false
          install_timeout: 1800
          tests: cert
          expected_results: ci/cnti-expected.yaml
          artifact_name: cnti-nonroot-essential

      - name: free5GC and UERANSIM, then a UE's traffic
        if: startsWith(matrix.job, 'traffic')
        run: |
          set -euo pipefail
          vals=$(sed -n 's/^ *helm_values: //p' cnti-testsuite.yaml)
          helm install free5gc charts/free5gc -n free5gc --create-namespace $vals --wait --timeout 20m
          # The UE's subscriber through the WebUI's REST API (free5gc/webconsole v1.4.3's own
          # default subscription, frontend/src/lib/dtos/subscription.test.ts): UERANSIM's UE.
          kubectl -n free5gc get svc,deploy -o name | grep -i webui
          dep=$(kubectl -n free5gc get deploy -o name | grep -i webui | head -1)
          kubectl -n free5gc rollout status $dep --timeout 5m
          kubectl -n free5gc port-forward --address 127.0.0.1 $dep 5000:5000 >/tmp/pf.log 2>&1 &
          ok=""; for i in $(seq 60); do curl -s -o /dev/null http://127.0.0.1:5000/ && { ok=1; break; }; sleep 2; done
          cat /tmp/pf.log
          [ -n "$ok" ] || { echo "::error::the WebUI did not answer on the port-forward"; kubectl -n free5gc logs $dep --tail=30; exit 1; }
          tok=$(curl -sS -X POST http://127.0.0.1:5000/api/login -H 'Content-Type: application/json' -d '{"username":"admin","password":"free5gc"}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          code=$(curl -sS -o /tmp/sub.out -w '%{http_code}' -X POST http://127.0.0.1:5000/api/subscriber/imsi-208930000000001/20893 -H "Token: $tok" -H 'Content-Type: application/json' --data @ci/nonroot/subscriber.json)
          echo "subscriber POST: HTTP $code $(head -c 200 /tmp/sub.out)"
          curl -sS http://127.0.0.1:5000/api/subscriber -H "Token: $tok" | head -c 300; echo
          kubectl -n free5gc get pods -o wide
          echo "--- the UPF processes: user and capabilities"
          for d in $(kubectl -n free5gc get deploy -o name | grep upf); do
            p=$(kubectl -n free5gc get pod -l "$(kubectl -n free5gc get $d -o jsonpath='{range .spec.selector.matchLabels}{@}{end}' >/dev/null; kubectl -n free5gc get $d -o go-template='{{range $k,$v := .spec.selector.matchLabels}}{{$k}}={{$v}},{{end}}' | sed 's/,$//')" -o name | head -1)
            echo "$d ($p): $(kubectl -n free5gc exec ${p#pod/} -- sh -c 'id; for s in /proc/[0-9]*/status; do grep -q "^Name:.upf$" $s && grep -E "^(Name|Uid|CapEff|CapPrm)" $s; done' | tr '\n' ' ')"
          done
          helm install ueransim charts/ueransim -n free5gc --set global.free5gcReleaseName=free5gc --wait --timeout 10m
          kubectl -n free5gc get pods -o wide | grep -i -E 'gnb|ue'
          ue=$(kubectl -n free5gc get pod -o name | grep -E 'ueransim-ue|-ue-' | head -1)
          for i in $(seq 150); do kubectl -n free5gc exec ${ue#pod/} -- ip addr show uesimtun0 >/dev/null 2>&1 && break; sleep 2; done
          kubectl -n free5gc exec ${ue#pod/} -- ip addr show uesimtun0
          # GitHub-hosted runners drop outbound ICMP, so ping says nothing; TCP over the UE's tunnel instead.
          kubectl -n free5gc exec ${ue#pod/} -- ping -I uesimtun0 -c 3 -W 3 8.8.8.8 || echo "(ICMP blocked on the runner, as expected)"
          code=$(kubectl -n free5gc exec ${ue#pod/} -- curl --interface uesimtun0 -sS -o /dev/null -m 20 -w '%{http_code}' https://www.google.com)
          echo "HTTPS over uesimtun0: $code"
          [ "$code" = 200 ] && echo "TRAFFIC OK through the UPFs ($([ "${{ matrix.job }}" = traffic-nonroot ] && echo non-root || echo root))"
      - name: Diagnostics
        if: failure()
        run: |
          set +e
          kubectl get pods -A -o wide
          for nf in amf ausf udm udr nrf smf dbpython; do p=$(kubectl -n free5gc get pods -o name | grep -- "-$nf" | head -1); echo "::group::$nf $p"; kubectl -n free5gc logs $p --all-containers --tail=80 | grep -a -i -E 'error|fail|warn|reject|congest|not found|discover|subscri|insert|imsi' | tail -30; echo "::endgroup::"; done
          for p in $(kubectl -n free5gc get pods -o name | grep -E 'upf|mongo|ue|gnb'); do echo "::group::$p"; kubectl -n free5gc describe $p | tail -30; kubectl -n free5gc logs $p --all-containers --tail=50; echo "::endgroup::"; done
