# Fork experiment: free5GC with MongoDB's tini and the UPFs not running as
# root. The UPF image with file capabilities is built here and loaded into
# kind, nothing is published. Two jobs: the essential tests, and a UE's
# traffic through the non-root UPFs.
name: free5GC non-root (fork experiment)
on:
  push:
    branches: [cnti-nonroot-experiment]
  workflow_dispatch:
jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        job: [essential, traffic]
    name: ${{ matrix.job }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CNTI_TESTSUITE_GENERIC_OPERATION_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and load the gtp5g kernel module
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential "linux-headers-$(uname -r)"
          git clone --depth 1 --branch v0.10.2 https://github.com/free5gc/gtp5g.git /tmp/gtp5g
          make -C /tmp/gtp5g -j"$(nproc)"
          sudo make -C /tmp/gtp5g install
          sudo modprobe gtp5g
      - name: Build the UPF image with file capabilities
        run: docker build -t free5gc/upf:v4.3.0-caps -f ci/nonroot/Dockerfile.upf ci/nonroot
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: cnti-testsuite
          config: ci/kind-cnti.yaml
      - name: Load the image into kind
        run: kind load docker-image free5gc/upf:v4.3.0-caps --name cnti-testsuite

      - uses: lfn-cnti/testsuite-action@3c0e163cbbdde302cdd9abb9dbe8c2cbd6a72c71 # v1.4.0
        if: matrix.job == 'essential'
        with:
          version: v2.4.1
          cnf_config: cnti-testsuite.yaml
          create_kind_cluster: false
          install_timeout: 1800
          tests: cert
          expected_results: ci/cnti-expected.yaml
          artifact_name: cnti-nonroot-essential

      - name: free5GC and UERANSIM, then a UE's traffic
        if: matrix.job == 'traffic'
        run: |
          set -euo pipefail
          vals=$(sed -n 's/^ *helm_values: //p' cnti-testsuite.yaml)
          helm install free5gc charts/free5gc -n free5gc --create-namespace $vals --wait --timeout 20m
          kubectl -n free5gc get pods -o wide
          echo "--- the UPF processes: user and capabilities"
          for d in $(kubectl -n free5gc get deploy -o name | grep upf); do
            p=$(kubectl -n free5gc get pod -l "$(kubectl -n free5gc get $d -o jsonpath='{range .spec.selector.matchLabels}{@}{end}' >/dev/null; kubectl -n free5gc get $d -o go-template='{{range $k,$v := .spec.selector.matchLabels}}{{$k}}={{$v}},{{end}}' | sed 's/,$//')" -o name | head -1)
            echo "$d ($p): $(kubectl -n free5gc exec ${p#pod/} -- sh -c 'id; grep -E "^Cap(Eff|Prm)" /proc/$(pgrep -x upf)/status' | tr '\n' ' ')"
          done
          helm install ueransim charts/ueransim -n free5gc --set global.free5gcReleaseName=free5gc --wait --timeout 10m
          kubectl -n free5gc get pods -o wide | grep -i -E 'gnb|ue'
          helm test ueransim -n free5gc --logs --timeout 5m || echo "::warning::helm test failed"
          ue=$(kubectl -n free5gc get pod -o name | grep -E 'ueransim-ue|-ue-' | head -1)
          for i in $(seq 30); do kubectl -n free5gc exec ${ue#pod/} -- ip addr show uesimtun0 >/dev/null 2>&1 && break; sleep 2; done
          kubectl -n free5gc exec ${ue#pod/} -- ip addr show uesimtun0
          kubectl -n free5gc exec ${ue#pod/} -- ping -I uesimtun0 -c 5 -W 3 8.8.8.8 && echo "TRAFFIC OK through the non-root UPFs"
      - name: Diagnostics
        if: failure()
        run: |
          set +e
          kubectl get pods -A -o wide
          for p in $(kubectl -n free5gc get pods -o name | grep -E 'upf|mongo|ue|gnb'); do echo "::group::$p"; kubectl -n free5gc describe $p | tail -30; kubectl -n free5gc logs $p --all-containers --tail=50; echo "::endgroup::"; done
